# Ligne du temps de la page d'accueil (« Notre parcours ») — modifiable dans Pages CMS
titre: "Jeunes, mais déjà pleinement engagés sur le terrain"
intro: "Créée en juin 2023, l'ONG Sécurité Vie n'a pas attendu des décennies pour faire ses preuves. En trois ans, nos équipes ont conduit des missions aux côtés d'entreprises, d'institutions et de bailleurs internationaux, avec des équipes mobiles, disponibles et qui documentent chaque activité."
etapes:
  - date: "Juin 2023"
    titre: "Création de l'ONG Sécurité Vie"
    texte: "Siège à Yamoussoukro, bureaux techniques dans le centre et le nord du pays."
  - date: "Mars 2024"
    titre: "Première mission routière à Anyama"
    texte: "Sensibilisation IST, VIH/sida et sécurité routière sur le reprofilage de la route d'Anyama, pour ENTP. Attestation de bonne exécution."
  - date: "Sept. 2025"
    titre: "325 km de routes du PCR-CI accompagnés"
    texte: "Lots 2 et 3 à Dabakala et Katiola, pour EGC-MS et ENTP : VIH, VBG, sécurité routière, plaintes, vaccination. Deux attestations de bonne exécution."
  - date: "Décembre 2025"
    titre: "Droits des femmes et santé sexuelle des jeunes"
    texte: "À Yamoussoukro, avec l'AGNDR, grâce au financement d'AmplifyChange."
  - date: "2026"
    titre: "Campagnes grand public avec MAFAD"
    texte: "Programme routier financé par la Banque mondiale : VIH/IST, VBG, environnement et plaintes."
  - date: "Octobre 2026"
    titre: "Chantier de l'aéroport de Kong"
    texte: "Mission de prévention confiée par EBOMAF, avec le Ministère des Infrastructures, la SODEXAM, Terrabo et le BNETD."
