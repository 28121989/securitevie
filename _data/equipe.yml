# Organisation : gouvernance, équipe (avec l'accord des personnes) et moyens — modifiable dans Pages CMS
gouvernance:
- titre: Conseil d'administration
  texte: Présidé par le Président du Conseil d'administration (PCA), il définit les grandes orientations de l'ONG et contrôle leur mise en œuvre.
- titre: Direction exécutive
  texte: Elle conduit la stratégie, la mobilisation des ressources et les relations avec les partenaires.
- titre: Direction des programmes
  texte: Elle pilote la conception, la mise en œuvre, le suivi et l'évaluation des projets sur le terrain.
- titre: Bureaux techniques
  texte: Ils mettent en œuvre les activités au plus près des communautés, en lien avec les autorités locales.
capacites: 'OSV s''appuie sur une équipe pluridisciplinaire : spécialistes en suivi-évaluation, experts en santé communautaire, sociologues, spécialistes HSE, communicateurs, spécialistes en sécurité routière et intervenants communautaires. Elle mobilise rapidement des relais locaux et connaît bien les réalités communautaires de la Côte d''Ivoire.'
moyens:
- 1 véhicule et 2 motos pour les déplacements sur le terrain
- 1 vidéoprojecteur, 3 ordinateurs et 2 imprimantes
- 2 appareils photo numériques et 2 mégaphones
- Collecte des données sur tablette ou téléphone (KoboToolbox)
