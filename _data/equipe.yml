# Pool d'experts mobilisables (présentés par profil ; noms publiés seulement avec l'accord écrit de chacun)
capacites: "OSV s'appuie sur une équipe pluridisciplinaire : spécialistes en suivi-évaluation, experts en santé communautaire, sociologues, spécialistes HSE, communicateurs, spécialistes en sécurité routière et intervenants communautaires. Elle mobilise rapidement des relais locaux et connaît bien les réalités communautaires de la Côte d'Ivoire."
experts:
  - profil: "Médecin, chef de mission"
    annees: "25 ans et plus"
    texte: "Docteur en médecine ; plus de 10 ans à la direction de programmes VIH et de renforcement du système de santé (EGPAF)."
  - profil: "Spécialiste en suivi-évaluation, superviseur général"
    annees: "10 ans"
    texte: "Master en suivi-évaluation ; coordination régionale de programmes genre et autonomisation, supervision de programmes de santé communautaire."
  - profil: "Sociologue, spécialiste genre et VBG"
    annees: "6 ans et plus"
    texte: "Doctorat en sociologie ; enquêtes de base et évaluations pour des partenaires internationaux."
  - profil: "Psychologue, genre et appui psychosocial"
    annees: "10 ans et plus"
    texte: "Doctorat en psychologie ; formation de prestataires de santé et d'agents sur la prise en charge psychosociale des VBG."
  - profil: "Assistant social"
    annees: "4 ans et plus"
    texte: "Diplôme d'État d'assistant social ; dépistage, soutien psychologique et orientation des survivantes de VBG."
  - profil: "Spécialiste en sécurité routière"
    annees: "10 ans et plus"
    texte: "Certifié par l'OSER ; animation de 6 projets de sensibilisation à la sécurité routière sur des chantiers routiers."
  - profil: "Spécialiste en communication"
    annees: "5 ans et plus"
    texte: "Master 2 en communication et développement ; supports en langues locales, spots radio et vidéo."
  - profil: "Environnement et HSE"
    annees: "Depuis 2019"
    texte: "Master 2 en développement durable, expert QHSE ; PGES, rapports environnementaux et sociaux, quarts d'heure sécurité."
  - profil: "Génie civil, ouvrages hydrauliques"
    annees: "Depuis 2020"
    texte: "BTS génie civil ; conduite de travaux et supervision d'ouvrages d'assainissement."
moyens:
  - "1 véhicule et 2 motos pour les déplacements sur le terrain"
  - "1 vidéoprojecteur, 3 ordinateurs et 2 imprimantes"
  - "2 appareils photo numériques et 2 mégaphones"
  - "Collecte des données sur tablette ou téléphone (KoboToolbox)"
