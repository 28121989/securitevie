vision: "Des communautés ivoiriennes en bonne santé, protégées et résilientes, où chacun peut vivre, se déplacer et travailler en sécurité."
mission: "Prévenir les risques qui menacent la vie et la santé des populations, en particulier des jeunes, des femmes et des enfants vulnérables, par la sensibilisation de proximité, l'accompagnement des communautés et le partenariat avec les autorités, les entreprises et les bailleurs."
valeurs:
  - titre: "Engagement"
    texte: "Nous agissons au quotidien, sur le terrain, aux côtés des communautés."
  - titre: "Intégrité et transparence"
    texte: "Nous gérons les ressources confiées avec rigueur et rendons compte de nos actions."
  - titre: "Respect et dignité"
    texte: "Nous respectons chaque personne, sans discrimination, et protégeons les plus vulnérables."
  - titre: "Proximité"
    texte: "Nos bureaux techniques nous permettent d'être au plus près des populations."
  - titre: "Redevabilité"
    texte: "Nous écoutons les communautés et traitons leurs plaintes et suggestions."
objectifs:
  - "Améliorer l'accès des jeunes et des femmes à l'information et aux services de santé sexuelle et reproductive, et lutter contre les violences basées sur le genre."
  - "Contribuer à l'accès à l'eau potable, à l'hygiène et à l'assainissement."
  - "Réduire les accidents de la route et les accidents du travail par la prévention et la formation."
  - "Promouvoir des pratiques agricoles durables pour la santé et les revenus des familles."
  - "Renforcer la redevabilité des projets grâce à des mécanismes de gestion des plaintes."
