vision: "Une société où chaque personne vit en sécurité, dans la dignité et en paix, au sein d'un environnement sain, propice à son épanouissement et au développement durable."
mission: "Contribuer à la protection de la vie et au renforcement de la sécurité des personnes et des communautés en produisant des connaissances, en développant des solutions innovantes et en appuyant les communautés, les institutions et les organisations dans la prévention, la réduction et la gestion durable des risques qui menacent les populations et leur environnement."
valeurs:
  - titre: "Protection de la vie"
  - titre: "Intégrité"
  - titre: "Excellence"
  - titre: "Innovation"
  - titre: "Solidarité"
  - titre: "Durabilité et redevabilité"
objectifs:
  - "Améliorer l'accès des jeunes et des femmes à l'information et aux services de santé sexuelle et reproductive, et lutter contre les violences basées sur le genre."
  - "Contribuer à l'accès à l'eau potable, à l'hygiène et à l'assainissement."
  - "Réduire les accidents de la route et les accidents du travail par la prévention et la formation."
  - "Promouvoir des pratiques agricoles durables pour la santé et les revenus des familles."
  - "Renforcer la redevabilité des projets grâce à des mécanismes de gestion des plaintes."
