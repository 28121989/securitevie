title: "ONG Sécurité Vie"
description: "L'ONG Sécurité Vie (OSV), basée à Yamoussoukro, agit en Côte d'Ivoire pour la santé sexuelle et reproductive, la lutte contre les VBG, l'eau et l'assainissement, l'environnement et la sécurité routière et au travail."
lang: fr
# Adresse du site
url: "https://ongsecuritevie.org"
baseurl: ""
# Code de vérification Google Search Console (à coller entre les guillemets)
google_verification: ""
plugins:
  - jekyll-sitemap
collections:
  actualites:
    output: true
    permalink: /actualites/:name/
  activites:
    output: false
  domaines:
    output: true
    permalink: /domaines/:name/
exclude:
  - .pages.yml
defaults:
  - scope:
      path: ""
      type: actualites
    values:
      layout: article
  - scope:
      path: ""
      type: domaines
    values:
      layout: domaine
