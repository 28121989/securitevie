{% assign z = site.data.zones %}
<figure class="carte-ci">
<style>{% for r in z.regions %}.carte-ci #r-{{ r.cle }}{fill:{{ r.couleur }};stroke:#fff;stroke-width:1.4}.carte-ci #l-{{ r.cle }}{display:block}{% endfor %}</style>
{% include carte-ci.svg %}
<figcaption><ul class="carte-ci-legende">{% for r in z.regions %}<li><span class="cc-pastille" style="background:{{ r.couleur }}"></span><span><strong>{{ r.nom }}</strong><small>{{ r.role }}{% if r.villes and r.villes != "" %} · {{ r.villes }}{% endif %}</small></span></li>{% endfor %}</ul></figcaption>
</figure>
