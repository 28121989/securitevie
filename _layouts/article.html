---
layout: page
---
<article class="article">
<p class="fil"><a href="{{ '/' | relative_url }}">Accueil</a> <span aria-hidden="true">›</span> <a href="{{ '/actualites/' | relative_url }}">Notre actualité</a></p>
<p class="surtitre">{{ page.date | date: "%d/%m/%Y" }}</p>
<h1>{{ page.title }}</h1>
{% if page.image and page.image != "" %}<img class="une" src="{{ page.image | relative_url }}" alt="">{% endif %}
<div class="corps">{{ content }}</div>
<p style="margin-top:40px"><a href="{{ '/actualites/' | relative_url }}">← Toute notre actualité</a></p>
</article>
