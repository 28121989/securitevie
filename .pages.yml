media:
  input: images
  output: /images
content:
  - name: actualites
    label: Actualités
    type: collection
    path: _actualites
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: image
        label: Photo
        type: image
      - name: resume
        label: Résumé (2 ou 3 lignes, affiché sur l'accueil)
        type: text
      - name: body
        label: Texte complet
        type: rich-text
  - name: activites
    label: Nos actions
    type: collection
    path: _activites
    view:
      fields: [title, lieu, periode]
    fields:
      - name: title
        label: Titre de l'activité
        type: string
        required: true
      - name: lieu
        label: Lieu
        type: string
      - name: periode
        label: Période (ex. 2025-2026)
        type: string
      - name: partenaires
        label: Partenaires et financement (donneur d’ordre, bailleur)
        type: string
      - name: image
        label: Photo
        type: image
      - name: description
        label: Description
        type: text
      - name: ordre
        label: Ordre d'affichage (1 = en premier)
        type: number
  - name: apropos
    label: Vision, mission, valeurs, objectifs
    type: file
    path: _data/apropos.yml
    fields:
      - name: vision
        label: Notre vision
        type: text
      - name: mission
        label: Notre mission
        type: text
      - name: valeurs
        label: Nos valeurs
        type: object
        list: true
        fields:
          - name: titre
            label: Valeur
            type: string
          - name: texte
            label: Explication
            type: text
      - name: objectifs
        label: Nos objectifs
        type: text
        list: true
  - name: infos
    label: Coordonnées et paramètres
    type: file
    path: _data/infos.yml
    fields:
      - name: logo
        label: Logo
        type: image
      - name: photo_accueil
        label: Grande photo de la page d'accueil (facultatif)
        type: image
      - name: date_creation
        label: Date de création
        type: string
      - name: directeur
        label: Directeur exécutif
        type: string
      - name: adresse
        label: Adresse du siège
        type: string
      - name: bureaux
        label: Bureaux techniques
        type: string
        list: true
      - name: telephone
        label: Téléphone
        type: string
      - name: email
        label: E-mail
        type: string
      - name: agrement
        label: Numéro d'agrément / récépissé
        type: string
      - name: partenaires
        label: Partenaires
        type: string
        list: true
  - name: galerie
    label: Galerie photos
    type: file
    path: _data/galerie.yml
    fields:
      - name: photos
        label: Photos (les plus récentes en haut)
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: legende
            label: Légende
            type: string
  - name: parcours
    label: Notre parcours (ligne du temps de l'accueil)
    type: file
    path: _data/parcours.yml
    fields:
      - name: titre
        label: Titre
        type: string
      - name: intro
        label: Texte d'introduction
        type: text
      - name: etapes
        label: Étapes
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: string
          - name: titre
            label: Titre
            type: string
          - name: texte
            label: Texte court
            type: text
  - name: diaporama
    label: Photos du diaporama (accueil)
    type: file
    path: _data/diaporama.yml
    fields:
      - name: vitesse
        label: Durée d'affichage de chaque photo (secondes)
        type: number
      - name: diapos
        label: Photos
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: rubrique
            label: Rubrique (domaine ou projet, en petit)
            type: string
          - name: titre
            label: Titre (le message de la photo)
            type: string
          - name: contexte
            label: Contexte (projet, partenaires, lieu, date)
            type: string
          - name: legende
            label: Légende
            type: string
  - name: chiffres
    label: Chiffres clés (accueil)
    type: file
    path: _data/chiffres.yml
    fields:
      - name: chiffres
        label: Chiffres
        type: object
        list: true
        fields:
          - name: valeur
            label: Chiffre
            type: string
          - name: libelle
            label: Ce qu'il représente
            type: string
  - name: equipe
    label: Organisation et équipe
    type: file
    path: _data/equipe.yml
    fields:
      - name: gouvernance
        label: Organes de gouvernance
        type: object
        list: true
        fields:
          - name: titre
            label: Organe
            type: string
          - name: texte
            label: Rôle
            type: text
      - name: equipe
        label: Équipe de direction
        type: object
        list: true
        fields:
          - name: nom
            label: Nom
            type: string
          - name: fonction
            label: Fonction
            type: string
          - name: photo
            label: Photo
            type: image
  - name: zones
    label: Zones d'intervention
    type: file
    path: _data/zones.yml
    fields:
      - name: intro
        label: Texte de présentation
        type: text
      - name: lieux
        label: Lieux sur la carte
        type: object
        list: true
        fields:
          - name: nom
            label: Ville
            type: string
          - name: type
            label: Type (Siège, Bureau technique ou Zone d'intervention)
            type: string
          - name: lat
            label: Latitude
            type: number
          - name: lng
            label: Longitude
            type: number
  - name: videos
    label: Galerie vidéos
    type: file
    path: _data/videos.yml
    fields:
      - name: videos
        label: Vidéos YouTube
        type: object
        list: true
        fields:
          - name: id
            label: Identifiant YouTube (après youtu.be/)
            type: string
          - name: titre
            label: Titre
            type: string
  - name: temoignages
    label: Témoignages
    type: collection
    path: _temoignages
    view:
      fields: [title, fonction]
    fields:
      - name: title
        label: Nom de la personne
        type: string
        required: true
      - name: fonction
        label: Fonction ou qualité
        type: string
      - name: citation
        label: Témoignage
        type: text
      - name: photo
        label: Photo (avec son accord)
        type: image
      - name: ordre
        label: Ordre d'affichage
        type: number
  - name: ressources
    label: Ressources (rapports, publications)
    type: collection
    path: _ressources
    view:
      fields: [title, categorie, date]
    fields:
      - name: title
        label: Titre du document
        type: string
        required: true
      - name: categorie
        label: Catégorie
        type: select
        options:
          values: [Rapports et publications, Bonnes pratiques]
      - name: date
        label: Date
        type: date
      - name: resume
        label: Résumé
        type: text
      - name: fichier
        label: Fichier PDF
        type: file
  - name: offres
    label: Carrière (appels d'offres et candidatures)
    type: collection
    path: _offres
    view:
      fields: [title, type, date_limite]
    fields:
      - name: title
        label: Intitulé
        type: string
        required: true
      - name: type
        label: Type
        type: select
        options:
          values: [Appel d'offres, Appel à candidatures]
      - name: date
        label: Date de publication
        type: date
      - name: date_limite
        label: Date limite (ex. 30 novembre 2026)
        type: string
      - name: resume
        label: Résumé
        type: text
      - name: fichier
        label: TDR / avis (PDF)
        type: file
